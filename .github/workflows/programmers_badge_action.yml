name: programmers_badge_action

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  repository_dispatch:
    types: [ trigger-workflow ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - name: Run Java program
      - name: Check generated badge
        run: |
          echo "Working directory:"
          pwd

          echo "Generated file:"
          ls -l result/result.svg

          echo "Git status:"
          git status --short

          echo "Badge values:"
          grep -oE '>[^<>]+</text>' result/result.svg | tail -n 8

          echo "Diff:"
          git diff -- result/result.svg
        env:
          PROGRAMMERS_TOKEN_ID: ${{ secrets.PROGRAMMERS_TOKEN_ID }}
          PROGRAMMERS_TOKEN_PW: ${{ secrets.PROGRAMMERS_TOKEN_PW }}
        run: ./gradlew run
      - name: Commit and Push changes
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          GIT_NAME: ${{ secrets.GIT_NAME }}
        run: |
          git config --global user.email "${{ env.GIT_EMAIL }}"
          git config --global user.name "${{ env.GIT_NAME }}"
          git add .
          echo "Staged diff:"
          git diff --cached -- result/result.svg

          if git diff --cached --quiet; then
            echo "result.svg has no changes."
            exit 0
          fi
          git commit -m "Update badge"
          git push https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git HEAD:main
